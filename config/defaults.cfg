; Standardinnstillinger for stasjonen (rom-1 / etasje -1).
;
; IKKE endre denne filen på Pi-en. Lag heller en fil som heter "station.cfg"
; i samme mappe som den eksporterte spillfilen (eller i user://) med bare de
; nøklene du vil overstyre, f.eks.:
;
;   [station]
;   printer_name="HP_LaserJet"
;   error_code="E-0451"
;
[station]

; Navn på denne stasjonen (sendes til kontrollskriptet).
station_id="rom-1"

; Koden som skrives ut på papiret. MÅ avtales med gruppen som lager etasje -2.
error_code="E-0451"

; Utskrift via CUPS. print_enabled=false => skriver bare til logg + fil.
print_enabled=true
print_command="lp"
; Tom = CUPS standardskriver. Se navn med: lpstat -p
printer_name=""
; Ekstra argumenter til lp, f.eks. ["-o", "cpi=12"]
print_args=[]

; Vis koden på sluttskjermen hvis utskriften feilet (anbefalt: true).
show_code_if_print_fails=true
; Vis alltid koden på sluttskjermen (for testing).
always_show_code=false

; Valgfri kommando som kjøres når skriveren "feiler" i spillet,
; f.eks. et python-skript som blinker en LED via GPIO. Tom = av.
; Eksempel: on_error_command=["python3", "/home/pi/blink.py"]
on_error_command=[]

; UDP-port som kontrollskriptet kan sende "RESET" / "STATUS" til. 0 = av.
status_port=4242

[display]

; Fullskjerm i eksportert versjon (ignoreres når man kjører fra editoren).
fullscreen=true
; "auto" = vis berøringskontroller hvis berøringsskjerm finnes, "on", "off".
touch_controls="off"
; Vignett/korn-effekt over skjermen.
screen_effects=true
; Tegn per sekund i dialogboksen.
text_speed=40.0
